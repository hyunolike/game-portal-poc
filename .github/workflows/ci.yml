name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write        # 테스트 결과 리포트
  pull-requests: write # 커버리지 코멘트

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      # 스타일 위반은 리뷰어가 아닌 기계가 잡는다
      - name: Verify format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build -c Release --no-restore

      # 엔티티를 바꾸고 마이그레이션을 빠뜨린 PR 차단
      - name: Check pending EF migrations
        run: dotnet ef migrations has-pending-model-changes -p src/GamePortal.Infrastructure -s src/GamePortal.Infrastructure --no-build -c Release

      - name: Unit tests
        run: >
          dotnet test tests/GamePortal.UnitTests -c Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # GitHub 호스티드 러너는 Docker 가 있으므로 Testcontainers 로 실제 SQL Server 를 띄운다
      - name: Integration tests (SQL Server via Testcontainers)
        run: >
          dotnet test tests/GamePortal.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Coverage summary
        if: ${{ !cancelled() }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/**/coverage.cobertura.xml
          format: markdown
          output: both
          thresholds: '60 80'

      - name: Coverage PR comment
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: code-coverage-results.md

  admin-web:
    name: Admin Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/GamePortal.Admin.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/GamePortal.Admin.Web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker-build:
    name: Docker build (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: [build-and-test, admin-web]
    strategy:
      matrix:
        service:
          - { name: admin-web, project: "", context: src/GamePortal.Admin.Web }
          - { name: web, project: src/GamePortal.Web }
          - { name: web-api, project: src/GamePortal.Web.Api }
          - { name: admin-api, project: src/GamePortal.Admin.Api }
          - { name: worker, project: src/GamePortal.Worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context || '.' }}
          build-args: PROJECT=${{ matrix.service.project }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
