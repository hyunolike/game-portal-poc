name: AI Code Review

# PR 마다 Claude 가 1차 리뷰를 남기고, 사람 리뷰어는 설계/도메인 판단에 집중한다.
# 저장소 Secret 에 ANTHROPIC_API_KEY 가 없으면 건너뛴다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check API key
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR 을 docs/CODE_REVIEW.md 의 체크리스트와 CLAUDE.md 의 컨벤션 기준으로 리뷰해 주세요.
            특히 다음을 우선 확인합니다:
            - 동시성: 재화/보상 관련 로직에서 조회 후 갱신(Lost Update) 패턴이 없는지
            - 트랜잭션 경계: 외부 API(게임 서버) 호출이 DB 트랜잭션 안에 있지 않은지
            - EF Core: N+1, 추적 쿼리 남용, 인덱스 없는 조건 추가
            - 운영툴 변경: 권한 정책 누락, 감사 로그 대상 누락
            - 테스트: 버그 수정/기능 추가에 대응하는 테스트 존재 여부
            스타일(포맷/네이밍)은 CI 가 검사하므로 지적하지 마세요.
            문제는 파일/라인에 인라인 코멘트로, 요약은 PR 코멘트 1개로 남겨 주세요.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
